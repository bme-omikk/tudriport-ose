name: Tudománymetria riportkészítő
on: [push, pull_request]

env:   
  MY_ROOT_DIR: ${GITHUB_WORKSPACE}
  MY_SQLIMPORT_DIR: ${GITHUB_WORKSPACE}/sqlimport
jobs:
  read_config: 
    runs-on: ubuntu-20.04
    outputs:
      name: ${{ steps.name.outputs.name }}
      host: ${{ steps.host.outputs.host }}
      user: ${{ steps.user.outputs.user }}
      pass: ${{ steps.pass.outputs.pass }}
    steps:
    - uses: actions/checkout@v1
    - name: Set up Python 3.7
      uses: actions/setup-python@v1
      with:
        python-version: 3.7
    - id: name
      run: echo "::set-output name=name::$(python3 -m tudriport.common.config -k db.SQLDB)"
    - id: host
      run: echo "::set-output name=host::$(python3 -m tudriport.common.config -k db.SQLHOST)"  
    - id: user
      run: echo "::set-output name=user::$(python3 -m tudriport.common.config -k db.SQLUSER)" 
    - id: pass
      run: echo "::set-output name=pass::$(python3 -m tudriport.common.config -k db.SQLPASS)"   
    
  build:
    runs-on: ubuntu-20.04
    needs: read_config
    env:
      MY_DB_NAME: ${{ needs.read_config.outputs.name }}
      MY_DB_HOST: ${{ needs.read_config.outputs.host }}
      MY_DB_USER: ${{ needs.read_config.outputs.user }}
      MY_DB_PASS: ${{ needs.read_config.outputs.pass }}
    services:
      postgres:
        image: postgres:11
        env:
          POSTGRES_USER: ${{ needs.read_config.outputs.user }}
          POSTGRES_PASSWORD: ${{ needs.read_config.outputs.pass }}
          POSTGRES_DB: ${{ needs.read_config.outputs.name }}
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@v1
    - name: Set up Python 3.7
      uses: actions/setup-python@v1
      with:
        python-version: 3.7
    - name: psycopg2 prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install python-dev libpq-dev libxml2-utils language-pack-hu        
    - name: Before Install
      run: |
        sudo sed -i -e '/local.*peer/s/postgres/all/' -e 's/peer\|md5/trust/g' /etc/postgresql/*/main/pg_hba.conf
        sudo service postgresql restart
        sleep 1
        curl https://showip.net/
        psql -w -U postgres -c "CREATE ROLE ${MY_DB_USER} PASSWORD 'md5********************************' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT LOGIN;"
        createdb -w -U postgres -h localhost $MY_DB_NAME -T template0 -E UTF8 -l hu_HU.UTF-8 -O $MY_DB_USER
        install -m 600 <(echo "localhost:*:$MY_DB_NAME:$MY_DB_USER:$MY_DB_PASS") $HOME/.pgpass
        cp test/assets/psqlrc $HOME/.psqlrc
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-django
    - name: Run migrations
      run: |
        cd riportkeszites-django/riport
        python manage.py migrate
        python manage.py create_default_groups
        python manage.py collectstatic -v 0 --no-input --clear
        python manage.py seeddb
        cd ../..
    - name: Cache MTMT2 Data
      id: cache-authors
      uses: actions/cache@v1
      with:
        path: ./test/resources/mtmt2-json
        key: mtmt2-cache
    - name: Download authors
      if: steps.cache-authors.outputs.cache-hit != 'true'
      run: ./test/resources/mtmt2-download-authors.sh
    - name: Test database
      run: |
        ./test/10-test-create-database.sh
        ./test/15-test-ext-author-import.sh
        ./test/21-validate-xml-test-files.sh
        ./test/22-load-xml-test-files.sh
        ./test/32-load-M2-json-test-files.sh
    - name: Test scoring
      run: ./test/35-test-scoring.sh
