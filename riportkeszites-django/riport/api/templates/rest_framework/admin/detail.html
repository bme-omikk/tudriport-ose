{% load rest_framework %}
{% load riport_api %}
{% load i18n %}

<div class="col-sm-2">
  <button class="btn btn-default" onclick="window.location.replace(document.referrer);">
    <span class="glyphicon glyphicon-arrow-left" aria-hidden="true"></span>
    {% trans 'Back' %}
  </button>
</div>

<table class="table table-striped">
  <tbody>
    {% for key, value in results|items %}
      {% if key in details %}
        <tr><th>{{ key|capfirst }}</th><td {{ value|add_nested_class }}>{{ value|cust_format_value }}</td></tr>
      {% endif %}
    {% endfor %}
  </tbody>
</table>
