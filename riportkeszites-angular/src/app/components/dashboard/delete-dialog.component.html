<h1 mat-dialog-title>Biztosan törli?</h1>
<div mat-dialog-content>
  <p>Mtid: {{data.mtmtcode}}</p>
  <p>Név: {{data.personname}}</p>
  <p>Neptun-kód: {{data.neptuncode}}</p>
  <p>Intézmény: {{data.org}}</p>
  <p>Hierarchia 1. szint: {{data.unit}}</p>
  <p>Hierarchia 2. szint: {{data.subunit}}</p>
  <p>Hierarchia 3. szint: {{data.subsubunit}}</p>
</div>
<mat-dialog-actions align="end">
  <button mat-raised-button [mat-dialog-close]="false">Mégse</button>
  <button mat-raised-button [mat-dialog-close]="true" color="primary" cdkFocusInitial>Igen</button>
</mat-dialog-actions>
