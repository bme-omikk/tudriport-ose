<mat-card *ngIf="permission">
  <mat-card-title>
    Várakozó feladatok  
  </mat-card-title>

  <table mat-table [dataSource]="inputQueueData">

    <ng-container matColumnDef="status_date">
      <th mat-header-cell *matHeaderCellDef>Létrehozva</th>
      <td mat-cell *matCellDef="let row">{{ row.status_date | date:"short" }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Szerzó/publikáció<th>
        <td mat-cell *matCellDef="let row">{{ row.type }}</td>
    </ng-container>

    <ng-container matColumnDef="identifier">
      <th mat-header-cell *matHeaderCellDef>Szerző/publikáció azonosítója</th>
      <td mat-cell *matCellDef="let row">{{ row.identifier }}</td>
    </ng-container>

    <ng-container matColumnDef="source">
      <th mat-header-cell *matHeaderCellDef>Használt forrás</th>
      <td mat-cell *matCellDef="let row">{{ row.source }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [length]="resultsLength" [pageSize]="pageSize" [hidePageSize]="true"></mat-paginator>
  <mat-progress-bar *ngIf="isLoadingResults" mode="indeterminate"></mat-progress-bar>
</mat-card>
