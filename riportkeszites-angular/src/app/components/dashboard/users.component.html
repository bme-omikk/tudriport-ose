<mat-card *ngIf="permission">
    <mat-card-title>
      Felhasználók
    </mat-card-title>

  <mat-form-field>
    <input matInput (keyup.enter)="refreshData()" [(ngModel)]="search" placeholder="Keresés">
  </mat-form-field>
  <button mat-raised-button (click)="refreshData()">Keresés</button>

  <table mat-table [dataSource]="users">
          <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef>Username<th>
            <td mat-cell *matCellDef="let row">{{ row.user.username }}</td>
          </ng-container>

          <ng-container matColumnDef="orgId">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let row">{{ row.orgId }}</td>
          </ng-container>

          <ng-container matColumnDef="last_name">
            <th mat-header-cell *matHeaderCellDef>Vezetéknév</th>
            <td mat-cell *matCellDef="let row">{{ row.user.last_name }}</td>
          </ng-container>

          <ng-container matColumnDef="first_name">
            <th mat-header-cell *matHeaderCellDef>Keresztnév</th>
            <td mat-cell *matCellDef="let row">{{ row.user.first_name }}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>E-mail</th>
            <td mat-cell *matCellDef="let row">{{ row.user.email }}</td>
          </ng-container>

          <ng-container matColumnDef="affiliation">
            <th mat-header-cell *matHeaderCellDef>Intézmények</th>
            <td mat-cell *matCellDef="let row">{{ row.affiliation }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Műveletek</th>
              <td mat-cell *matCellDef="let row">
                  <mat-form-field>
                    <mat-select 
                      placeholder="Csoportok" 
                      [(value)]="row.user.groups"
                      multiple>

                      <mat-option 
                      *ngFor="let group of availableGroups" 
                      (click)="toggleGroup(row.user.pk, group)"
                      [value]="group">

                      {{ group }}
                    </mat-option>
                    </mat-select>
                  </mat-form-field>
              </td>
            </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [length]="resultsLength" [pageSize]="pageSize" [hidePageSize]="true"></mat-paginator>
        <mat-progress-bar *ngIf="isLoadingResults" mode="indeterminate"></mat-progress-bar>
</mat-card>
